spring.application.name=ehr-mcp-server

# stdout is the MCP JSON-RPC channel. Nothing else may be written to it.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.pattern.console=

# Spring AI 2.0 does not enable stdio by default (spring.ai.mcp.server.stdio defaults to false).
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=ehr-mcp-server
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
